name: Recursive search APK

on:
  push:
    branches: [recursive-search]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: recursive-search-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: ${{ matrix.name }}
    if: github.ref == 'refs/heads/recursive-search'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Domain regression tests
            id: domain
            arguments: >-
              :domain:testApkstoreDebugUnitTest
              --tests org.cryptomator.domain.SharepointCloudTest
              --tests org.cryptomator.domain.usecases.DoLicenseCheckTest
          - name: Data regression tests
            id: data
            arguments: >-
              :data:testApkstoreDebugUnitTest
              --tests org.cryptomator.data.repository.CloudRepositoryImplTest
              --tests org.cryptomator.data.db.mappers.CloudEntityMapperTest
              --tests org.cryptomator.data.cloud.box.BoxApiTest
              --tests org.cryptomator.data.cloud.box.BoxCloudContentRepositoryTest
          - name: APK Store access tests
            id: apkstore
            arguments: >-
              :presentation:testApkstoreDebugUnitTest
              --tests org.cryptomator.presentation.licensing.LicenseEnforcerTest
              --tests org.cryptomator.presentation.docprovider.HelpersTest
              --tests org.cryptomator.presentation.presenter.CloudConnectionListPresenterTest
          - name: Accrescent access tests
            id: accrescent
            arguments: >-
              :presentation:testAccrescentDebugUnitTest
              --tests org.cryptomator.presentation.licensing.LicenseEnforcerAccrescentTest
              --tests org.cryptomator.presentation.presenter.VaultListPresenterLicenseLostTest
          - name: Play Store IAP access tests
            id: playstoreiap
            arguments: >-
              :presentation:testPlaystoreiapDebugUnitTest
              --tests org.cryptomator.presentation.licensing.LicenseEnforcerTest
              --tests org.cryptomator.presentation.docprovider.HelpersTest
              --tests org.cryptomator.presentation.presenter.VaultListPresenterFreemiumTest
          - name: Compile device regression tests
            id: instrumentation
            arguments: >-
              :presentation:assembleApkstoreDebugAndroidTest
              :data:assembleApkstoreDebugAndroidTest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install the SDK versions required by this commit
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          config = pathlib.Path('buildsystem/dependencies.gradle').read_text()
          compile_sdk = re.search(r'androidCompileSdkVersion\s*=\s*(\d+)', config).group(1)
          build_tools = re.search(r'androidBuildToolsVersion\s*=\s*[\x22\x27]([^\x22\x27]+)', config).group(1)
          subprocess.run(['android', 'sdk', 'install', f'platforms/android-{compile_sdk}', f'build-tools/{build_tools}'], check=True)
          PY

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Run the regression checks
        env:
          GRADLE_ARGUMENTS: ${{ matrix.arguments }}
        run: |
          read -r -a arguments <<< "$GRADLE_ARGUMENTS"
          bash ./gradlew "${arguments[@]}" --no-daemon --stacktrace

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-reports-${{ matrix.id }}-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: Build downloadable debug APK
    if: github.ref == 'refs/heads/recursive-search'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARTIFACT_NAME: cryptomator-recursive-search-${{ github.sha }}
    steps:
      - name: Check for an existing APK for this commit
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          query = urllib.parse.urlencode({'name': os.environ['ARTIFACT_NAME'], 'per_page': 100})
          url = f"{os.environ['GITHUB_API_URL']}/repos/{repo}/actions/artifacts?{query}"
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              artifacts = json.load(response)['artifacts']
          artifact = next((item for item in artifacts
              if not item['expired'] and item['size_in_bytes'] > 0
              and item['workflow_run']['head_sha'] == sha), None)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"exists={'true' if artifact else 'false'}\n")
          if artifact:
              download = (f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
                  f"{artifact['workflow_run']['id']}/artifacts/{artifact['id']}")
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"APK already exists for `{sha}`. [Download APK ZIP]({download}).\n")
          PY

      - name: Check out the exact commit
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.existing.outputs.exists != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install the SDK versions required by this commit
        if: steps.existing.outputs.exists != 'true'
        id: sdk
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          config = pathlib.Path('buildsystem/dependencies.gradle').read_text()
          compile_sdk = re.search(r'androidCompileSdkVersion\s*=\s*(\d+)', config).group(1)
          build_tools = re.search(r'androidBuildToolsVersion\s*=\s*[\x22\x27]([^\x22\x27]+)', config).group(1)
          try:
              subprocess.run(['android', 'sdk', 'install', f'platforms/android-{compile_sdk}', f'build-tools/{build_tools}'], check=True)
          except subprocess.CalledProcessError:
              subprocess.run(['android', 'sdk', 'list', '--all', 'platforms/*'], check=False)
              subprocess.run(['android', 'sdk', 'list', '--all', 'build-tools/*'], check=False)
              raise
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build-tools={build_tools}\n')
          PY

      - name: Set up Gradle cache
        if: steps.existing.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: false

      - name: Build the signed debug APK
        if: steps.existing.outputs.exists != 'true'
        run: bash ./gradlew :presentation:assembleApkstoreDebug --no-daemon --stacktrace

      - name: Verify and prepare the APK download
        if: steps.existing.outputs.exists != 'true'
        env:
          BUILD_TOOLS_VERSION: ${{ steps.sdk.outputs.build-tools }}
        run: |
          mkdir -p dist
          mapfile -t apks < <(find presentation/build/outputs/apk/apkstore/debug -type f -name '*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected one APK, found ${#apks[@]}" >&2
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs "${apks[0]}"
          cp "${apks[0]}" "dist/${ARTIFACT_NAME}.apk"
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT.txt
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload the APK and checksum
        if: steps.existing.outputs.exists != 'true'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Add the download link to the run summary
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            printf '### Recursive search debug APK\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf '[Download APK ZIP](%s)\n\n' "$ARTIFACT_URL"
            printf 'Extract the ZIP to install the debug APK. Downloads are retained for 90 days.\n'
          } >> "$GITHUB_STEP_SUMMARY"
